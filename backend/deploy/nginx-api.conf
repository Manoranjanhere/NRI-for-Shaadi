# Nginx reverse proxy for the NRI Shaadi API (Docker container on 127.0.0.1:3001)
# Install: sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/nrishaadi-api
#          sudo ln -sf /etc/nginx/sites-available/nrishaadi-api /etc/nginx/sites-enabled/
# Then:    sudo certbot --nginx -d nri-api.sugarbf.club
#
# server_name must match the domain in frontend/src/config/api.config.ts.
# If you change API_HOST_PORT in backend/.env, change proxy_pass below too.

server {
    listen 80;
    listen [::]:80;
    server_name nri-api.sugarbf.club;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO / WebSocket (chat realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
