# NRI Shaadi — API + PostgreSQL on one EC2 server
#
#   cp .env.production.example .env    # set DB_PASSWORD, JWT_SECRET, Firebase, AWS, Play…
#   docker compose up -d --build
#   docker compose logs -f api
#
# Postgres data lives in the named volume "nrishaadi-pgdata" and survives
# rebuilds / restarts. Never run `docker compose down -v` on the server (deletes the DB).
# Backups: bash scripts/db-backup.sh

name: nrishaadi

services:
  postgres:
    image: postgres:16-alpine
    container_name: nrishaadi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nrishaadi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_NAME:-nrishaadi}
      TZ: UTC
    # Loopback only — reach it from your laptop with an SSH tunnel, never expose publicly.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    networks:
      - nrishaadi-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nrishaadi-api:latest
    container_name: nrishaadi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-nrishaadi}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-nrishaadi}
      DB_SSL: "false"
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/privacy > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nrishaadi-net

networks:
  nrishaadi-net:
    driver: bridge

volumes:
  pgdata:
    name: nrishaadi-pgdata
